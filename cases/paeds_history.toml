# Synthetic paediatric history form (S13), data only: a copy of the ward patient_history questions.
# Filled in by a guardian for a young child (synthetic, 1930s). allergy_any alert_route = before_procedure.
form_id = "paeds-history"
version = "1"
audience = "patient"

[[question]]
id = "allergy_any"
alert_route = "before_procedure"
version = "1"
text = "Does your child have any medicine allergies?"
alert_answer = true
safety_critical = true
clinician_must_confirm = false

[[question]]
id = "allergy_reaction_severe"
version = "1"
text = "Has your child ever had a severe reaction to a medicine?"
alert_answer = true
safety_critical = true
clinician_must_confirm = false
ask_if = { id = "allergy_any", equals = true, wording = "you said you have no medicine allergies" }

[[question]]
id = "takes_blood_thinner"
version = "1"
text = "Does your child take a blood thinner?"
alert_answer = true
safety_critical = false
clinician_must_confirm = false
