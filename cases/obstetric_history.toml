# Synthetic obstetric history form (S15), data only. pregnant_possible: safety_critical, sensitive,
# alert_route before_procedure (per the S15 answer file).
form_id = "obstetric-history"
version = "1"
audience = "patient"

[[question]]
id = "allergy_any"
alert_route = "before_procedure"
version = "1"
text = "Do you have any allergies to medicines?"
alert_answer = true
safety_critical = true
clinician_must_confirm = false

[[question]]
id = "allergy_reaction_severe"
version = "1"
text = "Did a medicine allergy ever make it hard to breathe?"
alert_answer = true
safety_critical = true
clinician_must_confirm = false
ask_if = { id = "allergy_any", equals = true, wording = "you said you have no medicine allergies" }

[[question]]
id = "takes_blood_thinner"
version = "1"
text = "Do you take a blood thinner?"
alert_answer = true
safety_critical = false
clinician_must_confirm = false

[[question]]
id = "pregnant_possible"
alert_route = "before_procedure"
sensitive = true
version = "1"
text = "Could you be pregnant?"
alert_answer = true
safety_critical = true
clinician_must_confirm = false
